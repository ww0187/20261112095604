<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="茶话会 —— 一个数据只保存在本机的极简微博。" />
  <meta name="theme-color" content="#FBF7F0" />
  <title>茶话会 · 茶余饭后，随手聊两句</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='26' font-size='26'%3E%F0%9F%8D%B5%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="page">
    <!-- 顶部品牌栏 -->
    <header class="brand">
      <div class="brand__glow" aria-hidden="true"></div>
      <div class="brand__inner">
        <div class="brand__identity">
          <span class="brand__icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 9h12v4a6 6 0 0 1-6 6H10a6 6 0 0 1-6-6V9Z" />
              <path d="M16 10h1.8a2.2 2.2 0 0 1 0 4.4H16" />
              <path d="M7 4.5c.6.7.6 1.3 0 2M10.5 4c.6.7.6 1.3 0 2" />
              <path d="M4.5 21h11" />
            </svg>
          </span>
          <div>
            <h1 class="brand__title">茶话会</h1>
            <p class="brand__subtitle">茶余饭后，随手聊两句</p>
          </div>
        </div>

        <div class="brand__stats" title="本机已保存的茶话数量">
          <span class="brand__stats-num" id="stat-count">0</span>
          <span class="brand__stats-label">杯茶话</span>
        </div>
      </div>
    </header>

    <main class="shell">
      <!-- 发布卡片 -->
      <section class="composer card" aria-labelledby="composer-heading">
        <h2 class="visually-hidden" id="composer-heading">发布一条茶话</h2>

        <form id="composer-form" class="composer__form" novalidate>
          <div class="composer__field">
            <label class="composer__label" for="nickname">昵称</label>
            <input
              class="composer__nickname"
              id="nickname"
              name="nickname"
              type="text"
              maxlength="20"
              autocomplete="nickname"
              placeholder="你的昵称，可不填"
            />
          </div>

          <div class="composer__field composer__field--grow">
            <label class="visually-hidden" for="content">茶话内容</label>
            <textarea
              class="composer__textarea"
              id="content"
              name="content"
              rows="4"
              maxlength="200"
              placeholder="今天想聊点什么茶话？"
              aria-describedby="composer-hint"
            ></textarea>
          </div>

          <div class="composer__footer">
            <div class="composer__meta">
              <span class="composer__counter" id="counter" aria-live="polite">0 / 200</span>
              <span class="composer__hint" id="composer-hint">Ctrl / ⌘ + Enter 快速发布</span>
            </div>
            <button class="btn btn--primary" type="submit" id="submit-btn">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M4.5 12 20 4.5 15.5 20 12 13.5 4.5 12Z" />
              </svg>
              发布茶话
            </button>
          </div>
        </form>

        <p class="composer__toast" id="toast" role="status" aria-live="polite"></p>
      </section>

      <!-- 消息流 -->
      <section class="feed" aria-labelledby="feed-heading">
        <div class="feed__head">
          <h2 class="feed__title" id="feed-heading">茶话记录</h2>
          <button class="btn btn--ghost" type="button" id="clear-btn" hidden>清空全部</button>
        </div>

        <ul class="feed__list" id="feed-list" aria-live="polite"></ul>

        <!-- 空状态 -->
        <div class="empty" id="empty-state">
          <svg class="empty__art" viewBox="0 0 120 120" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M26 46h50v18a25 25 0 0 1-25 25h0a25 25 0 0 1-25-25V46Z" />
            <path d="M76 50h7a10 10 0 0 1 0 20h-7" />
            <path d="M38 28c2.5 3 2.5 5.5 0 8.5M52 24c2.5 3 2.5 5.5 0 8.5" />
            <path d="M22 100h58" />
          </svg>
          <p class="empty__title">还是一片寂静</p>
          <p class="empty__text">来泡第一杯茶，说点什么吧。</p>
        </div>
      </section>
    </main>

    <footer class="footer">
      <p>数据仅保存在本机浏览器 · 茶话会</p>
    </footer>
  </div>

  <script src="app.js" defer></script>
</body>
</html>
